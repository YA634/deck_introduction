{% extends 'base.html' %}
{% block title %}会員登録{% endblock %}
{% block h1 %}会員登録{% endblock %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form method="post" class="p-4 bg-light border rounded">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            {{ field.label_tag }}
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">登録</button>
                    <p class="mt-3 text-center">
                        <a href="{% url 'accounts:login' %}" class="text-decoration-none">ログイン</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    <br>
{% endblock %}
